<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #000; color: #fff; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #111; width: 90%; max-width: 400px; padding: 25px; border-radius: 20px; border: 2px solid #4169e1; display: none; }
        .active { display: block; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .item { border: 2px solid #333; border-radius: 12px; padding: 15px; text-align: center; cursor: pointer; }
        .selected { border-color: #4169e1; background: rgba(65, 105, 225, 0.1); }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333; border-radius: 8px; background: #000; color: #fff; box-sizing: border-box; outline: none; }
        .btn { width: 100%; background: #4169e1; color: #fff; border: none; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .sw { text-align: center; margin-top: 15px; font-size: 14px; color: #888; }
        .sw span { color: #4169e1; cursor: pointer; }
    </style>
</head>
<body>
    <div id="reg" class="card active">
        <h2>REGISTER</h2>
        <input type="email" id="re" placeholder="Gmail">
        <input type="password" id="rp" placeholder="Password">
        <button class="btn" onclick="auth('re','rp','REG','log')">Sign Up</button>
        <div class="sw">Have account? <span onclick="go('log')">Login</span></div>
    </div>
    <div id="log" class="card">
        <h2>LOGIN</h2>
        <input type="email" id="le" placeholder="Gmail">
        <input type="password" id="lp" placeholder="Password">
        <button class="btn" onclick="auth('le','lp','LOG','top')">Log In</button>
        <div class="sw">New? <span onclick="go('reg')">Register</span></div>
    </div>
    <div id="top" class="card">
        <h2>AXIO TOP UP</h2>
        <div class="grid">
            {% for o in offers %}
            <div class="item" onclick="sel(this, '{{o.name}} - {{o.price}} TK')">{{o.name}}<br>{{o.price}} TK</div>
            {% endfor %}
        </div>
        <form action="/order" method="POST">
            <input type="hidden" name="package" id="p_in" required>
            <input type="text" name="player_id" placeholder="UID" required>
            <select name="payment_method"><option value="bkash">bkash</option><option value="Nagad">Nagad</option></select>
            <input type="text" name="trx_id" placeholder="TrxID" required>
            <button type="submit" class="btn">Confirm Order</button>
        </form>
    </div>
    <script>
        function go(i) { document.querySelectorAll('.card').forEach(c => c.classList.remove('active')); document.getElementById(i).classList.add('active'); }
        function sel(e, v) { document.querySelectorAll('.item').forEach(i => i.classList.remove('selected')); e.classList.add('selected'); document.getElementById('p_in').value = v; }
        function auth(eI, pI, t, n) {
            var e = document.getElementById(eI).value, p = document.getElementById(pI).value;
            if(!e || !p) return alert("Empty!");
            var fd = new FormData(); fd.append('email', e); fd.append('password', p); fd.append('type', t);
            fetch('/auth', {method: 'POST', body: fd}).then(() => go(n));
        }
    </script>
</body>
</html>
